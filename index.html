<!DOCTYPE html>

  <title>不止</title>
  <link rel="stylesheet" href="style.css" />

<body>
  <div class="stage">

      <section class="profile">

            </a>
            <span class="post__tag">板评</span>

            <span class="post__name">不止</span>

          <circle class="ring__track" cx="24" cy="24" r="22"></circle>

        </svg>
        <span class="music__eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>
    </div>

  <canvas class="rain" aria-hidden="true"></canvas>
  <script src="script.js"></script>
